name: Build release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, optionally followed by -build.N for a corrected build
        required: true
        default: v0.4.3

permissions:
  contents: write

concurrency:
  group: release-dmg-${{ inputs.tag }}

jobs:
  installer:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag }}
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)(-build\.[1-9][0-9]*)?$ ]]
          release="${BASH_REMATCH[1]}"
          gh release view "$release" -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName
          ref="refs/tags/$TAG"
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "$ref"; then
            true
          else
            [[ $? == 2 && "$TAG" != "$release" ]]
            ref="$GITHUB_SHA"
          fi
          echo "SOURCE_REF=$ref" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Prepare build tools and pinned dependencies
        run: |
          if ! arch -x86_64 /usr/bin/true; then softwareupdate --install-rosetta --agree-to-license; fi
          git config --global url.https://github.com/.insteadOf git@github.com:
          git submodule update --init --depth 1 --jobs 4
          git submodule foreach 'if test "$sm_path" != "submodules/ansible-ios"; then git submodule update --init --recursive --depth 1; fi'
          git -C submodules/ansible-ios submodule update --init --recursive --depth 1 -- \
            third-party/libvpx/libvpx third-party/dav1d/dav1d third-party/td/td third-party/mtproto-engine
          brew install cmake ninja meson nasm yasm zlib autoconf libtool automake pkgconf
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          native_key="$( { xcodebuild -version; git ls-tree HEAD core-xprojects submodules scripts; } | shasum -a 256 | cut -d' ' -f1)"
          echo "NATIVE_CACHE=macos-native-arm64-$native_key" >> "$GITHUB_ENV"
          if ! xcrun metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          sed -i '' -E '/^#define ABSL_ATTRIBUTE_LIFETIME_BOUND (\[\[clang::lifetimebound\]\]|__attribute__\(\(lifetimebound\)\))/s/.*/#define ABSL_ATTRIBUTE_LIFETIME_BOUND/' \
            submodules/tg_owt/src/third_party/abseil-cpp/absl/base/attributes.h

      - name: Configure the registered macOS application
        env:
          ANSIBLE_API_ID: ${{ secrets.ANSIBLE_API_ID }}
          ANSIBLE_API_HASH: ${{ secrets.ANSIBLE_API_HASH }}
        run: |
          if ! [[ "$ANSIBLE_API_ID" =~ ^[1-9][0-9]{0,9}$ && "$ANSIBLE_API_ID" -le 2147483647 && "$ANSIBLE_API_HASH" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Configure the macOS release ANSIBLE_API_ID and ANSIBLE_API_HASH repository secrets."
            exit 1
          fi
          umask 077
          printf 'ANSIBLE_API_ID = %s\nANSIBLE_API_HASH = %s\n' "$ANSIBLE_API_ID" "$ANSIBLE_API_HASH" > configurations/Ansible.local.xcconfig

      - name: Restore native framework outputs
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ env.NATIVE_CACHE }}
          path: &native-outputs |
            core-xprojects/*/build/.framework-stamp
            core-xprojects/OpenH264/build/output
            core-xprojects/openssl/build/openssl
            core-xprojects/libopus/build/libopus
            core-xprojects/libvpx/build/libvpx
            core-xprojects/Mozjpeg/build/*.h
            core-xprojects/Mozjpeg/build/*.a
            core-xprojects/libwebp/build/libwebp
            core-xprojects/dav1d/build/dav1d
            core-xprojects/ffmpeg/build/ffmpeg
            core-xprojects/webrtc/build/webrtc
            core-xprojects/webrtc/build/src/**/*.h
            core-xprojects/tde2e/build/tde2e
            core-xprojects/mtproto-engine/build/libmtproto_engine_ffi.a
            submodules/ansible-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework

      - name: Prepare native frameworks
        run: |
          bash scripts/prepare-ansible-ios.sh
          if [[ "$(xcodebuild -version)" == "Xcode 27"* ]]; then bash scripts/xcode27.sh apply; fi
          bash scripts/configure_frameworks.sh > "$RUNNER_TEMP/frameworks.log" 2>&1 || {
            grep -E '(^|: )(fatal )?error:|CMake Error|FAILED:' "$RUNNER_TEMP/frameworks.log" | tail -40 || true
            tail -100 "$RUNNER_TEMP/frameworks.log"
            exit 1
          }
      - name: Save verified native frameworks before compiling Swift
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ env.NATIVE_CACHE }}
          path: *native-outputs

      - name: Build universal Release application
        run: |
          xcodebuild -quiet -workspace Ansible-Mac.xcworkspace -scheme Release -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Sign and verify the release image
        env:
          ANSIBLE_API_ID: ${{ secrets.ANSIBLE_API_ID }}
          ANSIBLE_API_HASH: ${{ secrets.ANSIBLE_API_HASH }}
        run: |
          stage="$RUNNER_TEMP/image"
          mkdir "$stage"
          app="$stage/Ansible.app"
          ditto "$RUNNER_TEMP/derived/Build/Products/Release/Ansible.app" "$app"
          for plist in "$app/Contents/Info.plist" "$app/Contents/PlugIns/AnsibleShare.appex/Contents/Info.plist"; do
            test "$(plutil -extract AnsibleApiId raw "$plist")" = "$ANSIBLE_API_ID"
            test "$(plutil -extract AnsibleApiHash raw "$plist")" = "$ANSIBLE_API_HASH"
          done
          codesign --force --deep --sign - "$app"
          ln -s /Applications "$stage/Applications"
          dmg="$RUNNER_TEMP/Ansible-macOS-${TAG#v}.dmg"
          hdiutil create -format UDZO -volname "Ansible ${TAG#v}" -srcfolder "$stage" "$dmg"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/verify-image"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Ansible.app"
          codesign --verify --deep --strict "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/Ansible"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${RELEASE_TAG#v}"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.ansible.macos

      - name: Attach verified DMG to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$SOURCE_REF" == "$GITHUB_SHA" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$(git rev-parse HEAD)"
          fi
          test "$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)" = "$(git rev-parse HEAD)"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Ansible-macOS-${TAG#v}.dmg" -R "$GITHUB_REPOSITORY"
